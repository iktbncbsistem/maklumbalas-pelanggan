<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borang Maklumbalas IKTBN Chembong</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Maklumbalas Kepuasan Pelanggan</h2>
        <p>Sila isi maklumat di bawah. Nombor tiket akan dihantar ke e-mel anda.</p>

        <form id="feedbackForm">
            <!-- Maklumat Pelajar -->
            <div class="form-group">
                <label for="email">E-mel Pelajar:</label>
                <input type="email" id="email" required placeholder="Masukkan e-mel anda">
            </div>

            <!-- Pilihan Jabatan & Pengajar -->
            <div class="form-group">
                <label for="jabatan">Bahagian / Bengkel:</label>
                <select id="jabatan" required>
                    <option value="">Sila Pilih...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pengajar">Nama Pengajar:</label>
                <select id="pengajar" required disabled>
                    <option value="">Silih Pilih Jabatan Dahulu...</option>
                </select>
            </div>
<!-- TAMPAL KOD SUBJEK INI DI SINI -->
            <div class="form-group">
                <label for="subjek">Subjek / Modul yang diajar:</label>
                <input type="text" id="subjek" required placeholder="Contoh: Asas Elektrik / Modul 1">
            </div>
            <hr>

            <!-- Soalan akan dijana secara automatik di sini -->
            <div id="dynamic-soalan-container"></div>

            <!-- Ruangan Cadangan -->
            <hr>
            <div class="form-group">
                <label for="cadangan">Cadangan Penambahbaikan:</label>
                <textarea id="cadangan" rows="4" placeholder="Tulis cadangan anda di sini..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">Hantar Maklumbalas</button>
        </form>

        <div id="successMessage" class="hidden">
            <h3>Terima Kasih!</h3>
            <p>Maklumbalas anda telah direkodkan. Nombor Tiket anda: <strong id="ticketNo"></strong></p>
        </div>
    </div>

    <!-- Skrip Supabase & Logik Aplikasi -->
    <script type="module" src="app.js"></script>
</body>
</html>
