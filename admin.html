<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Maklumbalas</title>
    <link rel="stylesheet" href="style.css"> <!-- Guna style sedia ada -->
    <!-- CDN untuk Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-container { max-width: 800px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .chart-container { position: relative; height: 400px; width: 100%; margin-top: 20px; }
        .cadangan-box { background: #f9f9f9; border-left: 4px solid #007bff; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h2>Papan Pemuka Analisa Maklumbalas</h2>
        
        <h3>Analisa Skor Pengajaran (Soalan T1)</h3>
        <div class="chart-container">
            <!-- Tempat Graf akan dipaparkan -->
            <canvas id="skorChart"></canvas>
        </div>

        <hr>

        <h3>Senarai Cadangan Penambahbaikan</h3>
        <div id="senaraiCadangan">
            <p>Memuatkan data cadangan...</p>          
        </div>
<hr>
<h3>Pengurusan Soalan Kaji Selidik</h3>
<div class="cadangan-box">
    <form id="formTambahSoalan">
        <div style="margin-bottom: 10px;">
            <label>Kategori (Cth: Pengajaran, Prasarana):</label>
            <input type="text" id="kategoriBaru" required placeholder="Pengajaran">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Kod Soalan (Cth: T2, B2):</label>
            <input type="text" id="kodBaru" required placeholder="T2">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Soalan Penuh:</label>
            <input type="text" id="soalanBaru" required placeholder="Masukkan soalan...">
        </div>
        <button type="submit">Tambah Soalan</button>
    </form>
</div>

<!-- ... (kod borang tambah soalan di atasnya) ... -->
        
        <hr>
        <h3>Senarai Soalan Semasa</h3>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
                <tr style="background-color: #007bff; color: white; text-align: left;">
                    <th style="padding: 10px; border: 1px solid #ddd;">Kategori</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">Kod</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">Soalan</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">Tindakan</th>
                </tr>
            </thead>
            <tbody id="senaraiSoalanBody">
                <tr><td colspan="4" style="padding: 10px; text-align: center;">Memuatkan data...</td></tr>
            </tbody>
        </table>
    </div> <!-- Ini tag penutup untuk <div class="dashboard-container"> -->

        
    </div>

    <!-- Skrip Supabase & Logik Admin -->
    <script type="module" src="admin.js"></script>
</body>
</html>
